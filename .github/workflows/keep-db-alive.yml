name: Keep free databases alive

# Upstash deletes free Redis databases after 14 days without traffic. CryptoVault's
# /actuator/health runs a real Redis (and MySQL) health check, so one ping a day keeps
# them alive while costing the Render free tier only ~15 minutes of uptime.
on:
  schedule:
    - cron: "30 6 * * *"   # 12:00 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CryptoVault health (touches Redis + MySQL)
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -sS --max-time 90 https://cryptovault-2o65.onrender.com/actuator/health || true)
            echo "attempt $i: $body"
            echo "$body" | grep -q '"UP"' && exit 0
            sleep 20
          done
          echo "CryptoVault health is not UP" >&2
          exit 1
