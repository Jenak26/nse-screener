name: Keep demos warm

# Pings every resume demo. Free Render services sleep after 15 min idle, and the
# free plan has 750 instance-hours/month shared across the workspace, so the two
# Render services are kept awake only from ~09:30 to 20:30 IST (2 x 11h x 31 = 682h).
# A failed run emails you, which doubles as downtime alerting.
on:
  schedule:
    - cron: "*/10 4-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://nse-screener-api.onrender.com/health
          - https://nse-screener-rose.vercel.app/api/meta
          - https://raftkv.onrender.com/api/state
          - https://jenak26-vol-surface-engine.hf.space/
          - https://snap-order-six.vercel.app/
          - https://algoplay-roan.vercel.app/
          - https://www.janakkabra.in/
    steps:
      - name: Ping ${{ matrix.url }}
        # Generous retries: a sleeping free instance takes up to ~60s to boot.
        run: curl -fsS -o /dev/null --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 -w "%{http_code} in %{time_total}s\n" "${{ matrix.url }}"
